# Use explicit devices only; do not auto-map all /dev/video* devices.
camera_support: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.0.0"

port_mappings:
- "8080:8080"

volume_mappings:
- "~/.cache/huggingface/:/root/.cache/huggingface/"

# One SO-101 follower + named cameras.
docker_extra_run_flags:
- "--device=/dev/ttyACM_follower:/dev/ttyACM_follower"
- "--device=/dev/webcam_top:/dev/webcam_top"
- "--device=/dev/webcam_front:/dev/webcam_front"
