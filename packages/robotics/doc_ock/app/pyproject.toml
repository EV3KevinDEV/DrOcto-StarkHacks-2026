[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-ock"
version = "0.1.0"
description = "Doc Ock runtime layer for Ryzers + LeRobot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
]
audio = [
  "elevenlabs>=1.0,<2",
  "sounddevice>=0.4,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
doc-ock = "doc_ock.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_ock*"]

[tool.setuptools.package-data]
doc_ock = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
